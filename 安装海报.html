<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智装点位通 · 安装海报</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --navy:#0E2147; --navy2:#1B3A6B; --orange:#FF7A1A; --orange2:#FF9A3D; }
  body{ font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#e9edf3; color:#fff; display:flex; justify-content:center; padding:24px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .poster{ width:430px; background:linear-gradient(160deg,var(--navy),var(--navy2)); border-radius:22px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.25); }
  .topbar{ height:8px; background:linear-gradient(90deg,var(--orange),var(--orange2)); }
  .head{ display:flex; align-items:center; gap:12px; padding:22px 24px 6px; }
  .logo{ width:56px; height:56px; border-radius:14px; object-fit:cover; box-shadow:0 6px 16px rgba(0,0,0,.35); background:#fff; }
  .brand{ font-size:13px; letter-spacing:2px; color:#cdd8ee; line-height:1.5; }
  .brand b{ color:#fff; font-size:17px; letter-spacing:1px; }
  .title{ text-align:center; padding:8px 20px 0; }
  .title h1{ font-size:42px; letter-spacing:6px; font-weight:800; }
  .title .sub{ margin-top:8px; font-size:13.5px; color:#bcd0f0; letter-spacing:.5px; }
  .qrwrap{ margin:20px auto 6px; width:224px; height:224px; background:#fff; border-radius:18px; padding:14px; box-shadow:0 10px 26px rgba(0,0,0,.3); }
  .qrwrap img{ width:100%; height:100%; display:block; }
  .scan{ text-align:center; font-size:17px; font-weight:700; color:#fff; margin-top:12px; }
  .scan span{ color:var(--orange2); }
  .steps{ display:flex; gap:12px; padding:16px 22px 4px; }
  .step{ flex:1; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:14px 12px; }
  .step h3{ font-size:15px; color:var(--orange2); margin-bottom:8px; }
  .step ol{ padding-left:18px; font-size:12.5px; line-height:1.75; color:#e7eefc; }
  .note{ margin:14px 22px 0; background:rgba(255,122,26,.14); border:1px solid rgba(255,122,26,.35); border-radius:12px; padding:10px 14px; font-size:12.5px; color:#ffe6cf; line-height:1.6; }
  .foot{ text-align:center; padding:14px 20px 22px; font-size:12px; color:#9fb3d8; }
  .foot .url{ color:#fff; font-weight:700; letter-spacing:.5px; }
  @page{ size:A4 portrait; margin:0; }
  @media print{ body{ background:#fff; padding:0; } .poster{ box-shadow:none; border-radius:0; } }
</style>
</head>

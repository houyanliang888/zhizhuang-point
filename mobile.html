<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2147">
<title>智装点位通 · 极速报价</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --navy:#0E2147; --navy2:#1B3A6B; --orange:#FF7A1A; --orange2:#FF9A3D;
    --bg:#F2F5FA; --card:#fff; --line:#E4E9F0; --text:#1A2233; --muted:#5B6B82;
  }
  html{ -webkit-overflow-scrolling:touch; overflow-y:auto; }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:16px;
    min-height:100%;
    padding-bottom:calc(86px + env(safe-area-inset-bottom));
  }

  /* 顶栏 */
  .top{
    background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);
    color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top)); position:sticky; top:0; z-index:10;
  }
  .top .t-row{ display:flex; align-items:center; gap:10px; }
  .top .logo{
    width:38px; height:38px; border-radius:10px; background:var(--orange);
    display:grid; place-items:center; font-size:20px; font-weight:800; flex:none;
  }
  .top h1{ font-size:17px; letter-spacing:1px; }
  .top .sub{ font-size:11px; opacity:.75; }
  .top .reset{
    margin-left:auto; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
    color:#fff; font-size:12px; padding:6px 12px; border-radius:8px;
  }

  main{ padding:12px 12px 0; }
  .sec{ margin-bottom:14px; }
  .sec-title{ font-size:13px; color:var(--muted); margin:0 2px 8px; display:flex; align-items:center; gap:6px; }
  .sec-title b{ color:var(--text); font-size:14px; }
  .sec-title .tag{ background:var(--orange); color:#fff; font-size:10px; padding:1px 7px; border-radius:8px; }

  /* 型号卡 */
  .models{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .model-card{
    background:var(--card); border:2px solid var(--line); border-radius:14px;
    padding:12px 10px; text-align:center; font-family:inherit;
    display:flex; flex-direction:column; gap:2px;
  }
  .model-card .m-name{ font-size:18px; font-weight:800; }
  .model-card .m-brand{ font-size:11px; color:var(--muted); }
  .model-card .m-price{ font-size:12px; color:var(--orange); font-weight:700; margin-top:2px; }
  .model-card.on{ border-color:var(--orange); background:#FFF6EC; box-shadow:0 4px 14px rgba(255,122,26,.18); }

  /* 空间 / 设备行 */
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row .r-icon{ font-size:20px; flex:none; width:26px; text-align:center; }
  .row .r-name{ font-size:15px; font-weight:500; }
  .row .r-name em{ font-style:normal; font-size:11px; color:var(--muted); margin-left:6px; }
  .row.has{ background:#FFF6EC; }

  .stepper{ margin-left:auto; display:flex; align-items:center; gap:2px; flex:none; }
  .step-num{ min-width:34px; text-align:center; font-size:17px; font-weight:800; }
  .step-btn{
    width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; font-size:20px; color:var(--muted); font-family:inherit;
    display:grid; place-items:center; line-height:1;
  }
  .step-btn.plus{ background:var(--orange); border-color:var(--orange); color:#fff; }
  .step-btn:active{ transform:scale(.92); }

  /* 折叠区 */
  details.sec > summary{
    list-style:none; cursor:pointer; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px; font-size:15px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  details.sec > summary::-webkit-details-marker{ display:none; }
  details.sec > summary::after{ content:'展开 ▾'; margin-left:auto; font-size:12px; color:var(--muted); font-weight:400; }
  details.sec[open] > summary::after{ content:'收起 ▴'; }
  details.sec > .panel{ border-top:none; border-radius:0 0 14px 14px; }
  details.sec[open] > summary{ border-radius:14px 14px 0 0; }
  .add-curtain{
    width:100%; margin-top:10px; padding:12px; border-radius:12px;
    border:1.5px dashed var(--orange); background:#FFF6EC; color:var(--orange);
    font-size:15px; font-weight:700; font-family:inherit;
  }

  /* 窗帘行 */
  .c-empty{ padding:16px; text-align:center; font-size:13px; color:var(--muted); }
  .c-row{ display:flex; align-items:center; gap:6px; padding:10px 10px; border-bottom:1px solid var(--line); }
  .c-row select{
    border:1px solid var(--line); border-radius:9px; padding:8px 4px; font-size:13px;
    background:#fff; color:var(--text); font-family:inherit; max-width:42%;
  }
  .c-row .c-width{ max-width:26%; }
  .c-del{ width:30px; height:30px; border:none; background:none; color:#c0392b; font-size:15px; flex:none; }

  /* 提示条 */
  .hint{ font-size:11px; color:var(--muted); margin:-6px 2px 14px; line-height:1.6; }

  /* 底部合计栏 */
  .total-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--navy); color:#fff;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:12px;
    box-shadow:0 -4px 20px rgba(14,33,71,.35);
  }
  .total-bar .col{ line-height:1.3; }
  .total-bar .k{ font-size:10px; opacity:.65; }
  .total-bar .v{ font-size:15px; font-weight:700; }
  .total-bar .grand{ margin-left:auto; text-align:right; }
  .total-bar .grand .v{ font-size:22px; color:var(--orange2); }
  .total-bar .detail-btn{
    background:var(--orange); border:none; color:#fff; font-size:13px; font-weight:700;
    padding:10px 14px; border-radius:10px; font-family:inherit; flex:none;
  }
  .t-count{ font-size:10px; color:var(--orange2); }

  /* 明细抽屉 */
  .detail-mask{
    position:fixed; inset:0; background:rgba(14,33,71,.5); z-index:30;
    display:none; align-items:flex-end;
  }
  .detail-mask.open{ display:flex; }
  .detail-sheet{
    background:#fff; width:100%; border-radius:20px 20px 0 0;
    max-height:78vh; display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .detail-head{
    padding:14px 16px; display:flex; align-items:center; border-bottom:1px solid var(--line);
  }
  .detail-head h3{ font-size:16px; }
  .detail-head button{
    margin-left:auto; border:none; background:#F2F5FA; width:32px; height:32px;
    border-radius:50%; font-size:14px; color:var(--muted); font-family:inherit;
  }
  .detail-body{ overflow-y:auto; padding:6px 16px 16px; }
  .detail-body h4{ font-size:12px; color:var(--muted); margin:14px 0 6px; }
  .d-row{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13.5px; border-bottom:1px dashed var(--line); }
  .d-row span:first-child{ flex:1; }
  .d-row b{ color:var(--orange); font-weight:700; }
  .d-empty{ padding:30px 0; text-align:center; color:var(--muted); font-size:13px; }
  .d-sum{ margin-top:14px; background:#FFF6EC; border-radius:12px; padding:4px 12px; }
  .d-sum .d-row{ border-bottom:none; }
  .d-sum .grand{ font-size:16px; }
  .d-sum .grand b{ font-size:20px; }

  /* 桌面提示：手机版在电脑上打开时给个去完整版的入口 */
  .to-full{ text-align:center; padding:4px 0 18px; }
  .to-full a{ color:var(--muted); font-size:12px; }
</style>
</head>
<body>

<header class="top">
  <div class="t-row">
    <div class="logo">智</div>
    <div>
      <h1>智装点位通</h1>
      <div class="sub">手机极速报价 · 工地随时用 · 断网可用</div>
    </div>
    <button class="reset" data-act="reset">清空</button>
  </div>
</header>

<main>
  <!-- 1. 型号 -->
  <div class="sec">
    <div class="sec-title"><b>① 选开关型号</b></div>
    <div class="models" id="mbModels"></div>
  </div>

  <!-- 2. 空间开关数 -->
  <div class="sec">
    <div class="sec-title"><b>② 各空间装几面</b><span class="tag">按 + 就行，键位自动分</span></div>
    <div class="panel" id="mbRooms"></div>
    <p class="hint">单/双/三/四键由经验规则自动分配（单键为主，灯多的空间升多键），明细里可核对。</p>
  </div>

  <!-- 3. 常用设备（折叠） -->
  <details class="sec" id="secExtras">
    <summary>③ 网关 · 传感器 · 设备</summary>
    <div class="panel" id="mbExtras"></div>
  </details>

  <!-- 4. 窗帘（折叠） -->
  <details class="sec" id="secCurtain">
    <summary>④ 电动窗帘（电机+轨道）</summary>
    <div class="panel" id="mbCurtainRows"></div>
    <button class="add-curtain" data-act="curtain-add">＋ 添加一个窗位</button>
  </details>

  <div class="to-full">
    <a href="index.html">电脑完整版（灯带/灯具/点位图/打印报价单）→</a>
  </div>
</main>

<!-- 底部固定合计 -->
<div class="total-bar">
  <div class="col">
    <div class="k">设备费 <span class="t-count" id="tCount"></span></div>
    <div class="v" id="tDevice">¥0</div>
  </div>
  <div class="col">
    <div class="k">安装调试 30%</div>
    <div class="v" id="tInstall">¥0</div>
  </div>
  <div class="col grand">
    <div class="k">客户总计</div>
    <div class="v" id="tGrand">¥0</div>
  </div>
  <button class="detail-btn" data-act="detail-open">明细</button>
</div>

<!-- 明细抽屉 -->
<div class="detail-mask" id="mbDetail">
  <div class="detail-sheet">
    <div class="detail-head">
      <h3>报价明细</h3>
      <button data-act="detail-close">✕</button>
    </div>
    <div class="detail-body" id="mbDetailBody"></div>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/quote-switch.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
